name: Apply next five annotation source audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-next5-annotation-audit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded corrections
        run: python .github/apply_next5_annotation_audit.py
      - name: Validate corrected annotations
        run: |
          python -m pip install --disable-pip-version-check jsonschema
          python step2_ad_schema/validate_annotations.py \
            step3_extension_20_v1/human_review_working/2011-0098__ee69a71e72e4a031.annotation.json \
            step3_extension_20_v1/human_review_working/2012-0259__71d534e47740b13c.annotation.json \
            step3_extension_20_v1/human_review_working/2013-0011__5f652dd0aa52e54f.annotation.json \
            step3_extension_20_v1/human_review_working/2016-0175__c13a622de38db424.annotation.json \
            step3_extension_20_v1/human_review_working/2018-0246__0ffbff521ab9746f.annotation.json
          python - <<'PY'
          import json
          from pathlib import Path
          prefixes = ('2011-0098', '2012-0259', '2013-0011', '2016-0175', '2018-0246')
          for path in Path('step3_extension_20_v1/human_review_working').glob('*.annotation.json'):
              if path.name.startswith(prefixes):
                  record = json.loads(path.read_text())
                  assert record['classification']['human_confirmed'] is False
                  assert record['benchmark_metadata']['gold_record'] is False
                  assert record['annotation_metadata']['record_status'] == 'first_pass_complete'
          PY
      - name: Commit corrected working annotations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add step3_extension_20_v1/human_review_working/*.annotation.json
          git rm .github/apply_next5_annotation_audit.py
          git rm .github/next5_annotation_audit_payload.b64
          git rm .github/next5_annotation_audit_payload.part0
          git rm .github/workflows/apply-next5-annotation-audit.yml
          git commit -m 'fix(step3): correct next five source-audited annotations'
          git push
