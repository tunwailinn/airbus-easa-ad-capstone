name: Inspect verbatim fidelity delta
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Inspect compact delta
        run: |
          python - <<'PY'
          import base64, gzip, json
          from pathlib import Path
          parts=sorted(Path('.github/verbatim_delta_chunks').glob('part*'))
          print('parts', [p.name for p in parts])
          encoded=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          print('encoded_chars', len(encoded))
          raw=base64.b64decode(encoded)
          print('compressed_bytes', len(raw), 'magic', raw[:2])
          text=gzip.decompress(raw).decode('utf-8')
          print('json_chars', len(text))
          obj=json.loads(text)
          print('top_type', type(obj).__name__)
          if isinstance(obj, dict):
              print('top_keys', list(obj)[:30])
              print('top_len', len(obj))
          elif isinstance(obj, list):
              print('top_len', len(obj))
          print('sample', json.dumps(obj, ensure_ascii=False)[:4000])
          PY
