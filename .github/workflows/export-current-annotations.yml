name: Export current annotations
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package current annotations
        run: |
          mkdir -p artifact
          cp step3_extension_20_v1/human_review_working/*.annotation.json artifact/
          tar -czf current-annotations.tar.gz -C artifact .
      - uses: actions/upload-artifact@v4
        with:
          name: current-annotations
          path: current-annotations.tar.gz
