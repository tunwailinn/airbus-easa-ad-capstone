name: Apply first five annotation source audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-first5-annotation-audit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded corrections
        run: python .github/apply_first5_annotation_audit.py
      - name: Validate corrected annotations
        run: |
          python -m pip install --disable-pip-version-check jsonschema
          python step2_ad_schema/validate_annotations.py \
            step3_extension_20_v1/human_review_working/2006-0077__d5877768ebe69914.annotation.json \
            step3_extension_20_v1/human_review_working/2007-0249__7a239ec5c306fa6d.annotation.json \
            step3_extension_20_v1/human_review_working/2008-0066__843fc74e8a4f44c0.annotation.json \
            step3_extension_20_v1/human_review_working/2009-0171__6edf8772870b3a19.annotation.json \
            step3_extension_20_v1/human_review_working/2010-0271__2db3e9f8dfdadc71.annotation.json
      - name: Commit corrected working annotations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add step3_extension_20_v1/human_review_working/*.annotation.json
          git rm .github/apply_first5_annotation_audit.py
          git rm .github/first5_annotation_audit_payload.b64
          git rm .github/workflows/apply-first5-annotation-audit.yml
          git commit -m 'fix(step3): correct first five source-audited annotations'
          git push
