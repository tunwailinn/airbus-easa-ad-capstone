name: Apply remaining annotation source audit PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/rest10-run-marker'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Apply guarded corrections
        run: python .github/apply_rest10_annotation_audit.py
      - name: Validate corrected annotations
        run: |
          python -m pip install --disable-pip-version-check jsonschema
          python step2_ad_schema/validate_annotations.py \
            step3_extension_20_v1/human_review_working/2019-0188__1d1f6357de0f3352.annotation.json \
            step3_extension_20_v1/human_review_working/2020-0016__5c6e21ab23447af0.annotation.json \
            step3_extension_20_v1/human_review_working/2021-0221__8aaaf372db377584.annotation.json \
            step3_extension_20_v1/human_review_working/2021-0286__a36d7f18af6e7a27.annotation.json \
            step3_extension_20_v1/human_review_working/2022-0058__772cd84a0961a452.annotation.json \
            step3_extension_20_v1/human_review_working/2023-0057__e17febf10e432eb9.annotation.json \
            step3_extension_20_v1/human_review_working/2024-0001__dc59a5a0114b782d.annotation.json \
            step3_extension_20_v1/human_review_working/2025-0138__5762b029d7edbc0c.annotation.json \
            step3_extension_20_v1/human_review_working/2025-0181__b0e89b78cd668c9e.annotation.json \
            step3_extension_20_v1/human_review_working/2026-0100__34edf2d1b2e65515.annotation.json
      - name: Commit corrected working annotations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add step3_extension_20_v1/human_review_working/*.annotation.json
          git rm .github/apply_rest10_annotation_audit.py
          git rm .github/rest10_annotation_audit_payload.part0
          git rm .github/rest10_annotation_audit_payload.part1
          git rm -r .github/rest10_chunks
          git rm .github/rest10-run-marker
          git rm .github/workflows/apply-rest10-annotation-audit.yml
          git rm .github/workflows/apply-rest10-annotation-audit-v2.yml
          git rm .github/workflows/apply-rest10-annotation-audit-pr.yml
          git commit -m 'fix(step3): correct remaining source-audited annotations'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
