name: Apply verified verbatim fidelity delta
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply guarded source/evidence delta
        run: python .github/apply_verbatim_delta.py
      - name: Validate all corrected annotations
        run: python step2_ad_schema/validate_annotations.py step3_extension_20_v1/human_review_working/*.annotation.json
      - name: Verify final diff contains only annotations
        run: |
          python - <<'PY'
          import subprocess
          files=subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'], text=True).splitlines()
          # The current commit still contains staging files, but the applier deleted them in the working tree.
          # Verify the staged working-tree result that will be committed contains no non-annotation additions.
          subprocess.run(['git','add','-A'], check=True)
          files=subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          bad=[f for f in files if not (f.startswith('step3_extension_20_v1/human_review_working/') and f.endswith('.annotation.json')) and not f.startswith('.github/')]
          if bad:
              raise SystemExit(f'unexpected staged paths: {bad}')
          ann=[f for f in files if f.startswith('step3_extension_20_v1/human_review_working/') and f.endswith('.annotation.json')]
          if len(ann)!=20:
              raise SystemExit(f'expected 20 annotation files in final staged change, got {len(ann)}')
          print('final annotation files:', len(ann))
          PY
      - name: Commit corrected annotations and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(step3): restore verbatim source and evidence fidelity"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
